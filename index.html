<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hockey Wisselcoach</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f6f8;color:#17202a}
header{background:#173b2c;color:white;padding:14px 16px;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.8}
main{max-width:700px;margin:auto;padding:14px}
.card{background:white;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px #00000012}
label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
input,select,button{font:inherit} input{width:100%;padding:10px;border:1px solid #ccd3d8;border-radius:10px}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}
.primary{background:#1f7a4d;color:white}.secondary{background:#e9eef0}.danger{background:#f5dddd;color:#8d1f1f}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
#setup .names{display:grid;gap:8px}
#setup .names .keeper{border-left:4px solid #f2c94c;padding-left:8px}
.hidden{display:none}
.pitch{position:relative;background:#6f9f70;border-radius:18px;aspect-ratio:0.82;max-height:680px;overflow:hidden;border:5px solid white;box-shadow:inset 0 0 0 2px #ffffff66}
.pitch:before{content:"";position:absolute;inset:5%;border:2px solid #ffffffaa;border-radius:8px}
.midline{position:absolute;left:5%;right:5%;top:50%;border-top:2px solid #ffffffaa}
.spot{position:absolute;transform:translate(-50%,-50%);width:29%;min-width:85px;text-align:center}
.player{background:white;border-radius:12px;padding:9px 5px;font-weight:800;box-shadow:0 2px 5px #0003;font-size:13px}
.pos{font-size:10px;color:#4b5a50;font-weight:700;margin-bottom:3px}
.p-la{left:22%;top:74%}.p-ma{left:35%;top:58%}.p-ra{left:65%;top:58%}
.p-ml{left:30%;top:43%}.p-mr{left:70%;top:43%}.p-lv{left:34%;top:20%}.p-rv{left:66%;top:20%}.p-gk{left:50%;top:91%}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.bench{background:#eef2f3;border-radius:10px;padding:8px 11px;font-weight:700}
.controls{display:flex;gap:8px;margin-top:12px}.controls button{flex:1}
.history{max-height:220px;overflow:auto;font-size:13px}.history div{padding:6px 0;border-bottom:1px solid #eee}
.small{font-size:12px;color:#64727b}
</style>
</head>
<body>
<header><h1>🏑 Hockey Wisselcoach</h1><div class="sub">8 tegen 8 · automatische roulatie</div></header>
<main>
<section id="setup" class="card">
  <h2>Nieuwe wedstrijd</h2>
  <label for="count">Totaal aantal speelsters</label>
  <select id="count">
    <option>8</option><option>9</option><option selected>10</option><option>11</option>
  </select>
  <p class="small">1 keeper + 7 veldspeelsters. Maximaal 3 wissels.</p>
  <div id="names" class="names"></div>
  <button class="primary" id="start">Start wedstrijd</button>
</section>

<section id="game" class="hidden">
  <div class="card">
    <div class="row">
      <div><strong>Wissel <span id="turn">0</span></strong><div class="small">Tik alleen op WISSEL</div></div>
      <button class="secondary" id="new">Nieuwe wedstrijd</button>
    </div>
  </div>

  <div class="card">
    <div class="pitch">
      <div class="midline"></div>
      <div class="spot p-la"><div class="pos">LINKSACHTER</div><div class="player" id="la"></div></div>
      <div class="spot p-ma"><div class="pos">MIDDENACHTER</div><div class="player" id="ma"></div></div>
      <div class="spot p-ra"><div class="pos">RECHTSACHTER</div><div class="player" id="ra"></div></div>
      <div class="spot p-ml"><div class="pos">MIDDENLINKS</div><div class="player" id="ml"></div></div>
      <div class="spot p-mr"><div class="pos">MIDDENRECHTS</div><div class="player" id="mr"></div></div>
      <div class="spot p-lv"><div class="pos">LINKSVOOR</div><div class="player" id="lv"></div></div>
      <div class="spot p-rv"><div class="pos">RECHTSVOOR</div><div class="player" id="rv"></div></div>
      <div class="spot p-gk"><div class="pos">KEEPER</div><div class="player" id="gk"></div></div>
    </div>
  </div>

  <div class="card">
    <strong>Wisselbank</strong>
    <div class="bank" id="bank"></div>
    <div class="controls">
      <button class="primary" id="swap">🔄 WISSEL</button>
      <button class="secondary" id="undo">↩️ UNDO</button>
    </div>
  </div>

  <div class="card">
    <strong>Wisselgeschiedenis</strong>
    <div class="history" id="history"></div>
  </div>
</section>
</main>
<script>
const positions=["la","ma","ra","ml","mr","lv","rv"];
let state=null, stack=[];
const namesEl=document.getElementById("names");
function renderNameInputs(){
  const n=+document.getElementById("count").value;
  namesEl.innerHTML="";
  for(let i=0;i<n;i++){
    const wrap=document.createElement("div");
    if(i===0) wrap.className="keeper";
    wrap.innerHTML=`<label>${i===0?"Keeper":"Speelster "+i}</label><input data-i="${i}" placeholder="${i===0?"Naam keeper":"Naam speelster "+i}">`;
    namesEl.appendChild(wrap);
  }
}
document.getElementById("count").onchange=renderNameInputs; renderNameInputs();

function snapshot(){ return JSON.parse(JSON.stringify(state)); }
function save(){ stack.push(snapshot()); if(stack.length>50) stack.shift(); }

document.getElementById("start").onclick=()=>{
  const inputs=[...namesEl.querySelectorAll("input")];
  const names=inputs.map(x=>x.value.trim()).filter(Boolean);
  const n=+document.getElementById("count").value;
  if(names.length!==n){alert("Vul alle namen in.");return;}
  state={gk:names[0], field:names.slice(1,8), bench:names.slice(8), turn:0, history:[]};
  stack=[]; document.getElementById("setup").classList.add("hidden"); document.getElementById("game").classList.remove("hidden"); render();
};
document.getElementById("new").onclick=()=>{if(confirm("Nieuwe wedstrijd starten?")){document.getElementById("game").classList.add("hidden");document.getElementById("setup").classList.remove("hidden");renderNameInputs();}};
document.getElementById("swap").onclick=()=>{
  if(!state.bench.length){alert("Er staat niemand op de wisselbank.");return;}
  save();
  const out=state.field[6], incoming=state.bench.shift();
  state.field=[incoming,...state.field.slice(0,6)];
  state.bench.push(out); state.turn++;
  state.history.unshift(`Wissel ${state.turn}: ${out} eruit → ${incoming} erin`);
  render();
};
document.getElementById("undo").onclick=()=>{
  if(!stack.length)return;
  state=stack.pop(); render();
};
function render(){
  if(!state)return;
  positions.forEach((p,i)=>document.getElementById(p).textContent=state.field[i]);
  document.getElementById("gk").textContent=state.gk;
  document.getElementById("turn").textContent=state.turn;
  const b=document.getElementById("bank"); b.innerHTML="";
  state.bench.forEach(x=>{const d=document.createElement("div");d.className="bench";d.textContent=x;b.appendChild(d)});
  document.getElementById("history").innerHTML=state.history.length?state.history.map(x=>`<div>${x}</div>`).join(""):"<div class='small'>Nog geen wissels.</div>";
}
</script>
</body>
</html>
