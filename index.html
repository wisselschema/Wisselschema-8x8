<!doctype html><html lang="nl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b2c"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><title>Hockey Wisselcoach v5</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f5f3;color:#14231c}
header{background:#173b2c;color:white;text-align:center;padding:12px}header img{width:58px;height:58px;object-fit:contain;background:white;border-radius:12px}
h1{font-size:21px;margin:6px}.wrap{max-width:760px;margin:auto;padding:10px}.card{background:white;border:1px solid #cbd5cf;border-radius:16px;padding:12px;margin:10px 0}
button,select,input{font:inherit}button{border:0;border-radius:12px;padding:11px 13px;background:#173b2c;color:white;font-weight:700}
button.secondary{background:#e7eee9;color:#173b2c}button.danger{background:#9d3b3b}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
label{font-weight:700;font-size:14px;display:block;margin:5px 0}select,input{width:100%;padding:10px;border:1px solid #cbd5cf;border-radius:10px;background:white;box-sizing:border-box}
.score{display:flex;justify-content:space-around;text-align:center}.scoreNum{font-size:42px;font-weight:800}.scoreBtns{display:flex;gap:6px}
.timer{text-align:center}.clock{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums}.subclock{margin-bottom:8px}
.notice{display:none;background:#fff0bd;border:2px solid #d2a900;border-radius:12px;padding:10px}.notice.show{display:block}
.schema{text-align:center;font-size:16px;font-weight:800;line-height:1.6}.next{text-align:center;font-weight:800;font-size:18px}
.field{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.pos{background:#eef5f1;border:1px solid #b8c9c0;border-radius:12px;padding:8px;text-align:center;min-height:60px}
.pos b{font-size:12px;color:#496057}.pos span{display:block;font-weight:800;margin-top:4px}.lv{grid-column:1/4}.rv{grid-column:4/7}.ml{grid-column:1/4}.mr{grid-column:4/7}.la{grid-column:1/3}.ma{grid-column:3/5}.ra{grid-column:5/7}.gk{grid-column:2/6;background:#eee}
.chip{display:inline-block;background:#edf2ef;border-radius:999px;padding:7px 10px;margin:3px;font-weight:700}.history{font-size:13px;max-height:180px;overflow:auto}.history div{padding:5px;border-bottom:1px solid #eee}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;padding:10px;box-sizing:border-box}.modal.open{display:flex}.sheet{background:white;border-radius:18px;padding:15px;width:100%;max-height:90vh;overflow:auto}
.saved{border:1px solid #cbd5cf;border-radius:10px;padding:8px;margin:7px 0}
</style></head><body>
<header><img src="logo.png" alt="HDS"><h1>Hockey Wisselcoach</h1></header><div class="wrap">

<div class="card"><div class="score">
<div><b>HDS</b><div id="us" class="scoreNum">0</div><button class="secondary" onclick="score('us',1)">+1</button> <button class="secondary" onclick="score('us',-1)">−1</button></div>
<div><b id="oppname">Tegenstander</b><div id="opp" class="scoreNum">0</div><button class="secondary" onclick="score('opp',1)">+1</button> <button class="secondary" onclick="score('opp',-1)">−1</button></div>
</div><label>Tegenstander</label><input id="opponent" placeholder="Naam tegenstander"></div>

<div class="card timer"><h2 id="half">1e helft</h2><div id="clock" class="clock">25:00</div>
<div>Volgende wissel: <b id="subclock">05:00</b></div><div id="notice" class="notice">🔔 <b>WISSELMOMENT</b><br><span id="noticeText"></span></div>
<div class="row"><div><label>Speelduur 1e helft</label><select id="h1"></select></div><div><label>Speelduur 2e helft</label><select id="h2"></select></div><div><label>Wissel elke</label><select id="sw"></select></div></div>
<div class="row"><button onclick="start()" id="start">▶ Start</button><button class="secondary" onclick="second()">🏑 Start 2e helft</button></div>
<div class="row"><button class="secondary" onclick="manual()">⚙️ Handmatig</button><button class="secondary" onclick="positionsSwap()">↔️ Posities wisselen</button><button class="secondary" onclick="undo()">↩️ Ongedaan</button></div></div>

<div class="card"><h2>🔄 WISSEL</h2><div class="schema">LA → MA → RA → ML → MR → LV → RV → eruit<br>Nieuwe invaller → LA</div><div id="next" class="next"></div></div>
<div class="card"><h2>Opstelling</h2><div id="field" class="field"></div></div>
<div class="card"><h2>Bank</h2><div id="bench"></div></div>
<div class="card"><h2>Wedstrijd</h2><div class="row"><button onclick="save()">💾 Opslaan</button><button onclick="exportMatch()">📤 Exporteren</button><button onclick="saved()">📂 Opgeslagen wedstrijden</button></div></div>
<div class="card"><details><summary>📊 Speeltijd per speler</summary><div id="times"></div></details></div>
<div class="card"><details><summary>📜 Wisselgeschiedenis</summary><div id="history" class="history"></div></details></div>
<div class="card"><button class="danger" style="width:100%" onclick="resetGame()">↻ Wedstrijd resetten</button></div>
</div><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>

<script>
const pos=[["LV","lv"],["RV","rv"],["ML","ml"],["MR","mr"],["LA","la"],["MA","ma"],["RA","ra"],["GK","gk"]];
const players=["Speler 1","Speler 2","Speler 3","Speler 4","Speler 5","Speler 6","Speler 7","Speler 8","Speler 9","Speler 10","Speler 11"];
let s={field:players.slice(0,8),bench:players.slice(8),us:0,opp:0,opponent:"",half:1,running:false,remaining:1500,nextSwap:300,h1:1500,h2:1500,swap:5,times:{},history:[]},undoStack=[],timer;
players.forEach(p=>s.times[p]=0);
function init(){for(let i=1;i<=40;i++){h1.innerHTML+=`<option>${i}</option>`;h2.innerHTML+=`<option>${i}</option>`}for(let i=1;i<=10;i++)sw.innerHTML+=`<option>${i}</option>`;h1.value=25;h2.value=25;sw.value=5;render()}
function fmt(x){x=Math.max(0,Math.round(x));return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function render(){us.textContent=s.us;opp.textContent=s.opp;oppname.textContent=s.opponent||"Tegenstander";half.textContent=s.half==1?"1e helft":"2e helft";clock.textContent=fmt(s.remaining);subclock.textContent=s.running?fmt(s.nextSwap):fmt(s.swap*60);start.textContent=s.running?"⏸ Pauze":"▶ Start";h1.value=Math.round(s.h1/60);h2.value=Math.round(s.h2/60);sw.value=s.swap;
field.innerHTML=pos.map((x,i)=>`<div class="pos ${x[1]}"><b>${x[0]}</b><span>${s.field[i]}</span></div>`).join("");bench.innerHTML=s.bench.map(x=>`<span class="chip">${x}</span>`).join("")||"Geen invallers";next.textContent=s.bench.length?`Volgende: ${s.bench[0]} komt erin voor ${s.field[6]} (RV)`:"Geen invaller op de bank";times.innerHTML=players.map(p=>`<div>${p}: <b>${fmt(s.times[p]||0)}</b></div>`).join("");history.innerHTML=s.history.slice().reverse().map(x=>`<div>${x}</div>`).join("")||"Nog geen wissels";localStorage.setItem("hw5state",JSON.stringify(s))}
function backup(){undoStack.push(JSON.stringify(s));if(undoStack.length>30)undoStack.shift()}
function undo(){if(!undoStack.length)return alert("Niets om ongedaan te maken.");s=JSON.parse(undoStack.pop());render()}
function score(k,n){backup();s[k]=Math.max(0,s[k]+n);render()}
function autoSwap(){if(!s.bench.length)return;backup();let out=s.field[6],inc=s.bench.shift();s.field=[inc,...s.field.slice(0,6)];s.bench.push(out);s.history.push(`${inc} erin op LA; ${out} eruit op RV`);try{navigator.vibrate&&navigator.vibrate([180,100,180])}catch(e){}noticeText.textContent=`${inc} erin op LA — ${out} eruit op RV`;notice.classList.add("show");setTimeout(()=>notice.classList.remove("show"),4000)}
function tick(){if(!s.running)return;s.remaining--;s.nextSwap--;s.field.forEach(p=>s.times[p]=(s.times[p]||0)+1);if(s.nextSwap<=0){autoSwap();s.nextSwap=s.swap*60}if(s.remaining<=0){s.remaining=0;s.running=false;noticeText.textContent=s.half==1?"Einde 1e helft.":"Einde wedstrijd.";notice.classList.add("show")}render()}
function start(){if(s.running){s.running=false;render();return}s.running=true;if(!timer)timer=setInterval(tick,1000);render();wake()}
function second(){if(s.half==2)return alert("De 2e helft is al gestart.");s.running=false;s.half=2;s.h2=+h2.value*60;s.remaining=s.h2;s.nextSwap=s.swap*60;s.history.push("Start 2e helft");render();start()}
function manual(){if(!s.bench.length)return alert("Geen invallers op de bank.");let out=prompt("Kies nummer van speler die eruit gaat:\n"+s.field.map((p,i)=>`${i+1}. ${p} (${pos[i][0]})`).join("\n"));let oi=+out-1;if(oi<0||oi>7)return;let inn=prompt("Kies nummer van invaller:\n"+s.bench.map((p,i)=>`${i+1}. ${p}`).join("\n"));let bi=+inn-1;if(bi<0||bi>=s.bench.length)return;backup();let a=s.field[oi],b=s.bench[bi];s.field[oi]=b;s.bench[bi]=a;s.history.push(`${b} erin op ${pos[oi][0]}; ${a} eruit`);render()}
function positionsSwap(){let a=+prompt("1 LV\n2 RV\n3 ML\n4 MR\n5 LA\n6 MA\n7 RA")-1,b=+prompt("1 LV\n2 RV\n3 ML\n4 MR\n5 LA\n6 MA\n7 RA")-1;if(a<0||a>6||b<0||b>6||a==b)return;backup();[s.field[a],s.field[b]]=[s.field[b],s.field[a]];s.history.push(`Posities gewisseld: ${pos[a][0]} ↔ ${pos[b][0]}`);render()}
function save(){s.opponent=opponent.value.trim();let a=JSON.parse(localStorage.getItem("hw5matches")||"[]");a.unshift({...s,savedAt:new Date().toISOString()});localStorage.setItem("hw5matches",JSON.stringify(a.slice(0,30)));alert("Wedstrijd opgeslagen op deze telefoon.")}
function exportMatch(){s.opponent=opponent.value.trim();let d={app:"Hockey Wisselcoach v5",datum:new Date().toLocaleString("nl-NL"),tegenstander:s.opponent,stand:s.us+"-"+s.opp,helft:s.half,wisseltijd:s.swap,speeltijd:s.times,opstelling:pos.map((x,i)=>({positie:x[0],speler:s.field[i]})),bank:s.bench,wisselgeschiedenis:s.history};let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download="hockeywedstrijd.json";a.click()}
function saved(){let a=JSON.parse(localStorage.getItem("hw5matches")||"[]");sheet.innerHTML="<h2>Opgeslagen wedstrijden</h2>"+(a.length?a.map((m,i)=>`<div class=saved><b>${m.opponent||"Onbekend"}</b><br>${new Date(m.savedAt).toLocaleString("nl-NL")} — ${m.us}-${m.opp}<br><button onclick="loadM(${i})">Laden</button> <button class=danger onclick="delM(${i})">Verwijderen</button></div>`).join(""):"Geen opgeslagen wedstrijden.")+"<button class=secondary onclick=closeM()>Sluiten</button>";modal.classList.add("open")}
function loadM(i){let a=JSON.parse(localStorage.getItem("hw5matches")||"[]");s=a[i];s.running=false;closeM();render()}function delM(i){let a=JSON.parse(localStorage.getItem("hw5matches")||"[]");a.splice(i,1);localStorage.setItem("hw5matches",JSON.stringify(a));saved()}function closeM(){modal.classList.remove("open")}
function resetGame(){if(!confirm("Wedstrijd resetten? Opgeslagen wedstrijden blijven bewaard."))return;s={field:players.slice(0,8),bench:players.slice(8),us:0,opp:0,opponent:"",half:1,running:false,remaining:+h1.value*60,nextSwap:+sw.value*60,h1:+h1.value*60,h2:+h2.value*60,swap:+sw.value,times:{},history:[]};players.forEach(p=>s.times[p]=0);undoStack=[];render()}
function wake(){if(navigator.wakeLock)navigator.wakeLock.request("screen").catch(()=>{})}
opponent.oninput=()=>{s.opponent=opponent.value;render()};sw.onchange=()=>{s.swap=+sw.value;s.nextSwap=s.swap*60;render()};h1.onchange=()=>{s.h1=+h1.value*60;if(!s.running&&s.half==1)s.remaining=s.h1;render()};h2.onchange=()=>{s.h2=+h2.value*60;render()};document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible"&&s.running)wake()});
let old=localStorage.getItem("hw5state");if(old)try{s=JSON.parse(old)}catch(e){}init();
</script></body></html>
